<!DOCTYPE html>
<html class="dark">
<head>
  <meta charset="utf-8">
  <style>
    body {
      background: #0a0b0d;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 520px;
    }

    .title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b909c;
      margin-bottom: 6px;
    }

    .halo-liquid-glass {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.5),
        0 4px 14px rgba(0, 0, 0, 0.25);
      color: #f6f7f9;
      outline: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      padding: 0;
      transition: all 0.15s ease;
    }

    /* Size sm (h-8 / 32px) */
    .file-sm {
      height: 32px;
      line-height: 30px;
      border-radius: 8px;
      font-size: 11px;
    }
    .file-sm::file-selector-button {
      height: 24px;
      margin: 3px 10px 3px 4px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      vertical-align: middle;
      transition: all 0.15s ease;
    }
    .file-sm:hover::file-selector-button {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Size default (h-10 / 40px) */
    .file-default {
      height: 40px;
      line-height: 38px;
      border-radius: 12px;
      font-size: 13px;
    }
    .file-default::file-selector-button {
      height: 28px;
      margin: 5px 12px 5px 6px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      vertical-align: middle;
      transition: all 0.15s ease;
    }
    .file-default:hover::file-selector-button {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Size lg (h-12 / 48px) */
    .file-lg {
      height: 48px;
      line-height: 46px;
      border-radius: 16px;
      font-size: 14px;
    }
    .file-lg::file-selector-button {
      height: 34px;
      margin: 6px 14px 6px 8px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      vertical-align: middle;
      transition: all 0.15s ease;
    }
    .file-lg:hover::file-selector-button {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Light Theme */
    .light-card {
      background: #f8f9fb;
      padding: 24px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .light-card .title {
      color: #585c65;
    }
    .light-card .halo-liquid-glass {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.9), 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      color: #121316;
    }
    .light-card .file-sm::file-selector-button,
    .light-card .file-default::file-selector-button,
    .light-card .file-lg::file-selector-button {
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: #ffffff;
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      color: #121316;
    }
    .light-card .file-sm:hover::file-selector-button,
    .light-card .file-default:hover::file-selector-button,
    .light-card .file-lg:hover::file-selector-button {
      background: #f5f5f7;
    }
  </style>
</head>
<body>
  <div>
    <div class="title">Dark Theme — Small (32px)</div>
    <input type="file" class="halo-liquid-glass file-sm">
  </div>

  <div>
    <div class="title">Dark Theme — Default (40px)</div>
    <input type="file" class="halo-liquid-glass file-default">
  </div>

  <div>
    <div class="title">Dark Theme — Large (48px)</div>
    <input type="file" class="halo-liquid-glass file-lg">
  </div>

  <div class="light-card">
    <div>
      <div class="title">Light Theme — Small (32px)</div>
      <input type="file" class="halo-liquid-glass file-sm">
    </div>
    <div>
      <div class="title">Light Theme — Default (40px)</div>
      <input type="file" class="halo-liquid-glass file-default">
    </div>
    <div>
      <div class="title">Light Theme — Large (48px)</div>
      <input type="file" class="halo-liquid-glass file-lg">
    </div>
  </div>
</body>
</html>
